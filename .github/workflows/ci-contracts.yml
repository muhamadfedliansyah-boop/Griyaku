name: CI Contracts Lint

on:
  push:
    paths:
      - "contracts/**"
      - ".spectral.yaml"
      - ".github/workflows/ci-contracts.yml"
  pull_request:
    paths:
      - "contracts/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install
      - name: Spectral Lint OpenAPI
        run: pnpm run lint:contracts
