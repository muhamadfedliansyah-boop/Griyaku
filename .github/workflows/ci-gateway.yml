name: CI Gateway

on:
  push:
    paths:
      - "services/gateway/**"
      - ".github/workflows/ci-gateway.yml"
  pull_request:
    paths:
      - "services/gateway/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Test Gateway
        run: |
          cd services/gateway
          go vet ./...
          go test -v -race ./...
