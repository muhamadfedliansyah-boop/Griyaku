services:
  postgres:
    image: postgres:16.4-alpine
    container_name: griyaku-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-griyaku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-griyaku_secret}
      POSTGRES_DB: ${POSTGRES_DB:-griyaku}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-griyaku} -d ${POSTGRES_DB:-griyaku}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - griyaku-net

  redis:
    image: redis:7.4-alpine
    container_name: griyaku-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - griyaku-net

  meilisearch:
    image: getmeili/meilisearch:v1.11.0
    container_name: griyaku-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-griyaku_meili_master_key_123}
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - griyaku-net

  minio:
    image: elestio/minio:latest
    container_name: griyaku-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-griyaku_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-griyaku_minio_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - griyaku-net

  minio-init:
    image: curlimages/curl:latest
    container_name: griyaku-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-griyaku_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-griyaku_minio_secret}
      MINIO_BUCKET: ${MINIO_BUCKET_MEDIA:-griyaku-media}
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      curl -sf http://minio:9000/minio/health/live && echo 'MinIO ready';
      exit 0;
      "
    networks:
      - griyaku-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: griyaku-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - griyaku-net

  mailpit:
    image: axllent/mailpit:v1.20
    container_name: griyaku-mailpit
    restart: unless-stopped
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_WEB_PORT:-8025}:8025"
    networks:
      - griyaku-net

volumes:
  postgres_data:
  redis_data:
  meili_data:
  minio_data:
  rabbitmq_data:

networks:
  griyaku-net:
    driver: bridge
